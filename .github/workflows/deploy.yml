name: Publish free website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test site
        run: npm test
      - name: Assemble public website only
        run: |
          mkdir -p _site/src _site/icons
          cp index.html styles.css sw.js manifest.webmanifest _site/
          cp src/*.js _site/src/
          cp icons/icon.svg icons/icon-192.png icons/icon-512.png _site/icons/
          touch _site/.nojekyll
      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
